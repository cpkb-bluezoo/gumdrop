# External dependency versions for Ant (build.xml resolve-deps).
# All of these are fetched from Maven Central (including org.bluezoo:gonzalez-core,
# org.bluezoo:jsonparser, and org.bluezoo:jprotobuf).
#
# Keep in sync with:
#   - pom.xml <dependencyManagement> (Dependabot updates this file)
#   - boms/gumdrop-j2ee-bom/pom.xml and boms/gumdrop-external-deps/pom.xml
#   - central/gumdrop-pom.xml / central/gumdrop-core-pom.xml
#
# Ant is the only build tool; Maven POMs are not executed during compilation.

gonzalez.version=1.2.0
jsonparser.version=1.3
jprotobuf.version=1.0.0
micula.version=1.0.1

jakarta.servlet.api.version=6.1.0
jakarta.annotation.api.version=3.0.0
jakarta.persistence.api.version=3.2.0
javax.mail.version=1.6.2
javax.annotation.api.version=1.3.2
javax.ejb.api.version=3.2.2
javax.persistence.api.version=2.2
jaxws.api.version=2.3.1

# Test-only (Ant resolve-test-deps; not needed for ant / ant dist)
junit.version=4.13.2
hamcrest.version=3.0

# Optional unit-test coverage (Ant resolve-jacoco; not used by ant test).
# Keep in sync with org.jacoco:* test deps in root pom.xml (Dependabot).
jacoco.version=0.8.15
jacoco.asm.version=9.9
