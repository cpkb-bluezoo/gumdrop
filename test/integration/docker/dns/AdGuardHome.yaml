# AdGuardHome.yaml for gumdrop's DNS client integration test instance.
#
# Baked in directly (rather than driven through the first-run install
# API at container startup, which is how this file was originally
# produced -- see the Dockerfile comment) so the container comes up
# fully configured with no setup step. schema_version and every
# unmentioned key below were captured from a real AdGuard Home
# first-run install and left as generated; only the fields needed for
# this test (tls, the static rewrite, and disabling the external
# filter-list download so startup doesn't depend on internet access)
# were changed.
http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
      - GET /dns-query
      - POST /dns-query
      - GET /dns-query/{ClientID}
      - POST /dns-query/{ClientID}
    insecure_enabled: false
  address: 0.0.0.0:80
  session_ttl: 30d
users:
  - name: admin
    password: $2a$10$.l2TiwnwJWBKeGcUZfqsUue5kspOE14Cfl0YKnJC1Yi9oJvo6hA5W
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: ""
theme: auto
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  anonymize_client_ip: false
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
    - https://dns10.quad9.net/dns-query
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
    - 2620:fe::10
    - 2620:fe::fe:10
  fallback_dns: []
  upstream_mode: load_balance
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_enabled: true
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: false
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: true
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
# Enables DoT (port_dns_over_tls) and DoQ (port_dns_over_quic) alongside
# plain DNS above, and DoH via the http block's routes. All four wire
# formats the client supports (UDP, TCP, DoT, DoH, DoQ) are reachable
# on this single instance.
tls:
  enabled: true
  server_name: dns-test
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  certificate_chain: ""
  private_key: ""
  certificate_path: /opt/adguardhome/certs/cert.pem
  private_key_path: /opt/adguardhome/certs/key.pem
  strict_sni_check: false
querylog:
  dir_path: ""
  ignored: []
  interval: 90d
  size_memory: 1000
  enabled: false
  ignored_enabled: false
  file_enabled: false
statistics:
  dir_path: ""
  ignored: []
  interval: 1d
  enabled: false
  ignored_enabled: false
# No external filter lists: keeps startup hermetic (no dependency on
# being able to reach adguardteam.github.io) and this instance isn't
# testing ad-blocking behaviour anyway.
filters: []
whitelist_filters: []
user_rules: []
dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: UTC
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: false
    duckduckgo: false
    ecosia: false
    google: false
    pixabay: false
    yandex: false
    youtube: false
  blocking_mode: default
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  # Static A record, resolved identically over every transport, so
  # tests assert an exact known answer instead of depending on real
  # internet name resolution being reachable/stable from wherever
  # these tests happen to run. 203.0.113.0/24 is the RFC 5737
  # documentation range: guaranteed never a real routable address.
  rewrites:
    # .test is the IANA/RFC 6761-reserved TLD for testing; .local was
    # tried first and didn't work -- AdGuard Home (correctly) special-
    # cases it as mDNS-reserved (RFC 6762) and refuses to answer it
    # authoritatively regardless of rewrites configured for it.
    - domain: resolvethis.gumdrop.test
      answer: 203.0.113.55
      enabled: true
  safe_fs_patterns:
    - /opt/adguardhome/work/userfilters/*
  max_http_size: 268435456
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 0
  blocked_response_ttl: 10
  # Rewrites are processed as part of the same filtering engine as the
  # blocklists (tried filtering_enabled: false first, since there are
  # no filters configured -- that also silently disabled the rewrite
  # below, so this has to stay true).
  filtering_enabled: true
  rewrites_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: false
    arp: false
    rdns: false
    dhcp: false
    hosts: false
  persistent: []
log:
  enabled: true
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
os:
  group: ""
  user: ""
  rlimit_nofile: 0
schema_version: 34
