# redis.conf for gumdrop's Redis client integration test instance.

port 6379
requirepass testpass

tls-port 6380
tls-cert-file /tls/cert.pem
tls-key-file /tls/key.pem
# One-way TLS, same rationale as the other test containers' certs: this
# exercises the client's handshake and encrypted RESP traffic, not
# mutual authentication.
tls-auth-clients no

daemonize no
protected-mode no
