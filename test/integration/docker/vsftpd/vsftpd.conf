# vsftpd.conf for gumdrop's FTP client integration test instance.
#
# Single local user, chrooted, read/write, PASV with a narrow published
# port range, AUTH TLS/PROT P available but not required (so both the
# plaintext and TLS-upgrade paths can be exercised against the same
# instance, same reasoning as smtpd_tls_security_level=may in the
# Postfix test container).

listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

# testuser's home directory is used directly as the chroot root, so no
# separate upload subdirectory dance is needed for this test instance.
local_root=/home/testuser

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
# The client connects from the host via the published port range above,
# not from another container on the same network, so the PASV reply
# must advertise the loopback address the ports are actually published
# on rather than the container's internal IP.
pasv_address=127.0.0.1
pasv_addr_resolve=NO

ssl_enable=YES
rsa_cert_file=/etc/vsftpd/tls/cert.pem
rsa_private_key_file=/etc/vsftpd/tls/key.pem
# Offered, not required -- see class comment above.
force_local_logins_ssl=NO
force_local_data_ssl=NO
# Deliberately NOT setting ssl_tlsv1_1/ssl_tlsv1_2/ssl_tlsv1_3 explicitly:
# on this vsftpd/OpenSSL 3.0 combination (Debian bookworm's vsftpd 3.0.3),
# setting any of those three directives -- to YES or NO, regardless of
# seccomp_sandbox -- makes vsftpd exit(2) immediately on startup with no
# diagnostic on stdout/stderr/syslog. Leaving them unset uses vsftpd's
# default negotiation range, which still excludes SSLv2/SSLv3 below and
# in practice offers TLS 1.2/1.3 since that's what the linked OpenSSL
# supports.
ssl_sslv2=NO
ssl_sslv3=NO

# vsftpd requires this to be set explicitly once ssl_enable is on, per
# its own startup check, even though this test instance always resumes
# the control session's TLS parameters for the data channel (the only
# thing PROT P needs).
require_ssl_reuse=NO

pam_service_name=ftp
userlist_enable=NO

seccomp_sandbox=NO

# vsftpd's per-connection privilege separation calls unshare(CLONE_NEWNET)
# by default (isolate_network=YES) to put each connection handler in its
# own empty network namespace. Under a non-privileged podman container
# that call fails in a way vsftpd doesn't handle cleanly -- disabling it
# here removes one such crash path, but was NOT sufficient by itself
# (the daemon still segfaulted, exit 139, silently, after exactly one
# connection with this off) -- the container must also be run with
# --privileged; see the Dockerfile's run command. Left set regardless,
# since it avoids one unnecessary syscall even under --privileged.
isolate_network=NO

xferlog_enable=NO
dirmessage_enable=NO
