# sockd.conf for gumdrop's SOCKS client integration test instance.
#
# No-auth CONNECT-only proxy on the internal (listening) side; the
# external side just needs a route out to wherever the client asks it
# to connect (typically another container on the same podman network,
# such as postfix-test, by container name -- podman's built-in DNS
# resolves that from inside this container).

logoutput: stderr

internal: 0.0.0.0 port = 1080
external: eth0

# clientmethod governs the (rarely used) SOCKS-client-identd handshake;
# socksmethod governs actual SOCKS4/5 authentication. "none" first so a
# client that doesn't offer credentials still gets through; "username"
# second so a client that does offer them (RFC 1929) is exercised too,
# against a real system account via PAM.
clientmethod: none
socksmethod: none username

user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect disconnect error
}
