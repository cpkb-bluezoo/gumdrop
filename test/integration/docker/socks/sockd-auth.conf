# Alternate sockd.conf that REQUIRES SOCKS5 username/password auth
# (RFC 1929), rather than offering "none" first. Dante selects methods
# by priority among what the client offers, so a config listing both
# "none" and "username" would always pick "none" whenever the client
# offers it too (as gumdrop's SOCKSClientHandler always does, even when
# credentials are configured) -- meaning the username/password wire path
# would never actually be exercised against a config like sockd.conf's.
# This variant is dedicated to that path: only "username" is offered, so
# a successful CONNECT here proves the client's RFC 1929 sub-negotiation
# actually worked, not just that it was offered and skipped.

logoutput: stderr

internal: 0.0.0.0 port = 1080
external: eth0

clientmethod: none
socksmethod: username

user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect disconnect error
}
