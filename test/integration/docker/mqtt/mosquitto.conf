# mosquitto.conf for gumdrop's MQTT client integration test instance.
#
# Both listeners require username/password auth (mqttuser/mqttpass, see
# the Dockerfile's mosquitto_passwd step) so both the plaintext and TLS
# paths can be exercised the same way against the same instance.

persistence false
log_dest stdout

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
certfile /mosquitto/tls/cert.pem
keyfile /mosquitto/tls/key.pem
