name: Dependabot auto-merge

# Scoped strictly to Dependabot PRs (github.actor check below) - this must
# never auto-merge human fix/feature work. Auto-merge itself still waits
# for the branch protection ruleset's required checks (test, CodeQL) to
# pass before GitHub actually merges anything; this workflow only opts
# eligible PRs into that queue.
on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Minor and patch bumps only - never auto-merge a major bump.
      - name: Enable auto-merge for minor/patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
