name: Publish to GitHub Packages

# Publishes every Gumdrop Maven coordinate, each with its own POM, so that
# all the modules resolve against each other. The artifact list and version
# guards are shared with the Maven Central workflow through
# scripts/release-artifacts.sh; the deploy itself is
# scripts/publish-to-github-packages.sh, which can also be run by hand.

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          # Writes settings.xml with credentials for the repository id the
          # deploy script uses ("github").
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy all artifacts to GitHub Packages
        run: ./scripts/publish-to-github-packages.sh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
