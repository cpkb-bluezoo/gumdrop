name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Normal ant clean test finishes in a few minutes (one JVM per test class).
    # Per-class Ant/JUnit timeout is 120s; cap the job here instead of the
    # 6h Actions default if the suite regresses.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run unit tests
        run: ant clean test
