name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Normal ant clean test finishes in ~3 min; a stuck JUnit fork (e.g.
    # tearDown gumdrop.join() with a selector loop that never exits) has no
    # Ant-level timeout, so cap the job here instead of burning the full
    # 6h Actions default.
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run unit tests
        run: ant clean test
