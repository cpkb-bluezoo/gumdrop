version: 2
updates:
  # Keep GitHub Actions workflow steps (actions/checkout, actions/setup-java,
  # etc.) current. Nothing was doing this before - only Dependabot security
  # updates were enabled, which only fires on a known CVE, not routine
  # version staleness or Node runtime deprecations.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependabot scans root pom.xml <dependencyManagement> for external jar versions.
  # Ant resolve-deps reads boms/versions.properties — keep both in sync when
  # merging Dependabot PRs (see docs/MODULARIZATION-PLAN.md Phase 0).
  # The boms/*/pom.xml files mirror the same pins for future BOM publication;
  # Dependabot does not scan them (not named pom.xml at repo root).
  # central/gumdrop-pom.xml is updated by hand for Maven Central metadata.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
