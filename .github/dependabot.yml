version: 2
updates:
  # Keep GitHub Actions workflow steps (actions/checkout, actions/setup-java,
  # etc.) current. Nothing was doing this before - only Dependabot security
  # updates were enabled, which only fires on a known CVE, not routine
  # version staleness or Node runtime deprecations.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Only the root pom.xml can be scanned: Dependabot's maven ecosystem only
  # ever looks for a file literally named pom.xml in `directory`, and the
  # central/*-pom.xml files are deliberately NOT named pom.xml (so that
  # `mvn`/tooling doesn't auto-discover them outside the explicit
  # publish-to-central.sh flow - see central/gumdrop-pom.xml's header
  # comment). A "/central" entry here always fails with
  # "/central/pom.xml not found" (issue: run 31725470839) and there is no
  # Dependabot config to point it at a differently-named file, so it isn't
  # configured. If central/*-pom.xml dependencies drift from pom.xml's,
  # they need to be updated by hand.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
